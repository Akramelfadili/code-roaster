services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_roaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_roaster"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_roaster_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_roaster_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
